<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Library — Embedding Space</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #333; }
  #container { width: 100vw; height: 100vh; position: relative; }
  svg { width: 100%; height: 100%; }
  .tooltip {
    position: absolute; padding: 10px 14px; background: #fff; border: 1px solid #ddd;
    border-radius: 6px; font-size: 13px; pointer-events: none; opacity: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); max-width: 320px; line-height: 1.5;
  }
  .tooltip .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .tooltip .meta { color: #666; font-size: 12px; }
  .tooltip .tags { color: #888; font-size: 11px; margin-top: 4px; }
  .legend {
    position: absolute; top: 16px; right: 16px; background: #fff; border: 1px solid #ddd;
    border-radius: 6px; padding: 12px 16px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .label { font-size: 11px; fill: #555; pointer-events: none; }
</style>
</head>
<body>
<div id="container">
  <svg></svg>
  <div class="tooltip"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4A90D9"></div> Raw item</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27AE60"></div> Nugget</div>
    <div style="margin-top:8px;color:#888;font-size:11px">Node size = maturity level</div>
  </div>
</div>
<script>
const data = [{"id": "4b0495e5-a9cc-49b6-9c8a-db3a12f4cf3c", "title": "Agent Composition", "item_type": "raw", "maturity": "stub", "confidence": "low", "tags": "agents, composition, skills, orchestration", "x": -33.90043258666992, "y": -24.852880477905273}, {"id": "5d890b18-69b7-4042-be59-3b0c54e2c417", "title": "Agent Flattening", "item_type": "raw", "maturity": "stub", "confidence": "low", "tags": "agents, flattening, teams, orchestration", "x": -13.946499824523926, "y": -55.025821685791016}, {"id": "e7ffcd64-fec7-4baf-b6f0-7bbe93b14cbb", "title": "Design Principles for LLM-Native Pipelines", "item_type": "raw", "maturity": "stub", "confidence": "low", "tags": "llm-native, design-principles, pipelines, architecture", "x": -73.27494812011719, "y": -17.37228012084961}, {"id": "a1c52f39-b946-4af2-91f0-7217920ea127", "title": "Responsibility Patterns", "item_type": "raw", "maturity": "stub", "confidence": "low", "tags": "agents, responsibility, patterns, coordination, multi-agent", "x": 20.60443687438965, "y": -14.959344863891602}, {"id": "79f15266-0386-4215-9458-f6440eba93e8", "title": "Agent Composition: Structuring Agents, Skills, and Teams", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agent-composition, skills, orchestration, no-nesting, non-overlapping-ownership, teammates", "x": -19.198589324951172, "y": -16.78352165222168}, {"id": "35be87c5-6f04-47fb-86b6-7f6b5e695454", "title": "Agent Flattening: Making Standalone Agents Team-Ready", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agent-flattening, delegation, splitting, teams, context-budgeting, forked-skills", "x": -28.208986282348633, "y": -64.31562042236328}, {"id": "c5ca653b-0912-4136-b474-135239469d2f", "title": "Multi-Agent Responsibility Patterns", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "responsibility-patterns, multi-agent, coordination, shared-state, pipeline, delegation, observation, swarm, trigger-models", "x": 29.675878524780273, "y": -28.902734756469727}, {"id": "b9382f47-2117-49b8-bd3a-99939c2dc850", "title": "Prose as Program: Designing LLM-Native Pipelines", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "llm-native, pipeline-design, externalized-state, prose-as-program, contracts, compression-boundaries", "x": -82.17008209228516, "y": -3.2341198921203613}, {"id": "f36943bd-bd3d-4a7d-a188-4b9e8421b33e", "title": "Useful Custom Agents for Claude Code", "item_type": "raw", "maturity": "stub", "confidence": "low", "tags": "agents, catalog, reference, automation, multi-agent", "x": 62.727638244628906, "y": 28.067829132080078}, {"id": "d2bae234-ebf9-49e8-922a-6fc9334a1b61", "title": "Software Development Agent Catalog", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agents, software-development, testing, code-review, documentation, devops, refactoring, catalog", "x": 50.01496124267578, "y": 39.37299346923828}, {"id": "4817b236-9f46-4141-8da7-67af61d65b28", "title": "Business Operations Agent Catalog", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agents, business-operations, legal, finance, human-resources, strategy, sales, supply-chain, customer-support", "x": 54.96855926513672, "y": 66.2684555053711}, {"id": "789ed487-86fe-4615-9894-4e23fb37fcf0", "title": "Specialized Domain Agent Catalog", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agents, healthcare, research, academia, education, specialized-domains", "x": 35.15483093261719, "y": 58.646121978759766}, {"id": "96ec1ccb-3750-48dd-88b7-aca6a7dab15f", "title": "Agent Extensibility and Composability", "item_type": "nugget", "maturity": "summary", "confidence": "medium", "tags": "agents, composability, extensibility, patterns, design-principles", "x": -19.523988723754883, "y": 8.076388359069824}];

const width = window.innerWidth;
const height = window.innerHeight;
const margin = 60;

const svg = d3.select("svg")
  .attr("viewBox", [0, 0, width, height]);

const g = svg.append("g");

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.3, 10])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

// Scales
const xExtent = d3.extent(data, d => d.x);
const yExtent = d3.extent(data, d => d.y);
const xPad = (xExtent[1] - xExtent[0]) * 0.15 || 1;
const yPad = (yExtent[1] - yExtent[0]) * 0.15 || 1;

const x = d3.scaleLinear()
  .domain([xExtent[0] - xPad, xExtent[1] + xPad])
  .range([margin, width - margin]);

const y = d3.scaleLinear()
  .domain([yExtent[0] - yPad, yExtent[1] + yPad])
  .range([height - margin, margin]);

const colorMap = { raw: "#4A90D9", nugget: "#27AE60" };
const sizeMap = { stub: 8, summary: 12, detailed: 16, complete: 20 };

const tooltip = d3.select(".tooltip");

// Draw points
g.selectAll("circle")
  .data(data)
  .join("circle")
    .attr("cx", d => x(d.x))
    .attr("cy", d => y(d.y))
    .attr("r", d => sizeMap[d.maturity] || 10)
    .attr("fill", d => colorMap[d.item_type] || "#999")
    .attr("stroke", "#fff")
    .attr("stroke-width", 1.5)
    .attr("opacity", 0.85)
    .style("cursor", "pointer")
    .on("mouseover", (event, d) => {
      tooltip.style("opacity", 1)
        .html(`<div class="title">${d.title}</div>
               <div class="meta">${d.item_type} · ${d.maturity} · ${d.confidence}</div>
               <div class="tags">${d.tags}</div>
               <div class="meta" style="margin-top:4px">${d.id}</div>`);
    })
    .on("mousemove", (event) => {
      tooltip
        .style("left", (event.pageX + 14) + "px")
        .style("top", (event.pageY - 14) + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0));

// Labels
g.selectAll(".label")
  .data(data)
  .join("text")
    .attr("class", "label")
    .attr("x", d => x(d.x))
    .attr("y", d => y(d.y) - (sizeMap[d.maturity] || 10) - 4)
    .attr("text-anchor", "middle")
    .text(d => d.title.length > 30 ? d.title.slice(0, 28) + "…" : d.title);
</script>
</body>
</html>
