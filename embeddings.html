<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Library — Embedding Space</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: 260px; min-width: 260px; background: #161822; border-right: 1px solid #2a2d3a;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header { padding: 16px; border-bottom: 1px solid #2a2d3a; }
  #sidebar-header h2 { font-size: 14px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

  /* Search */
  #search {
    width: 100%; padding: 8px 12px; background: #1e2030; border: 1px solid #2a2d3a;
    border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none;
  }
  #search:focus { border-color: #4A90D9; }
  #search::placeholder { color: #555; }

  /* Stats */
  #stats {
    padding: 12px 16px; border-bottom: 1px solid #2a2d3a; font-size: 12px; color: #9ca3af;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 4px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Tags */
  #tags-header {
    padding: 12px 16px 8px; display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #9ca3af;
  }
  #clear-tags { cursor: pointer; color: #4A90D9; font-size: 11px; }
  #clear-tags:hover { text-decoration: underline; }
  #tags-list {
    flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-wrap: wrap;
    gap: 6px; align-content: flex-start;
  }
  .tag-chip {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer;
    background: #1e2030; border: 1px solid #2a2d3a; color: #9ca3af;
    transition: all 0.15s ease; user-select: none; white-space: nowrap;
  }
  .tag-chip:hover { border-color: #4A90D9; color: #e0e0e0; }
  .tag-chip.active { background: #1a3a5c; border-color: #4A90D9; color: #7bb8f0; }
  .tag-count { font-size: 10px; color: #555; margin-left: 2px; }

  /* Main area */
  #main { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; }
  .label { font-size: 11px; fill: #777; pointer-events: none; }

  /* Tooltip */
  .tooltip {
    position: absolute; padding: 12px 16px; background: #1e2030; border: 1px solid #2a2d3a;
    border-radius: 8px; font-size: 13px; pointer-events: none; opacity: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); max-width: 340px; line-height: 1.5; z-index: 10;
  }
  .tooltip .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #fff; }
  .tooltip .meta { color: #9ca3af; font-size: 12px; }
  .tooltip .tags { color: #6b7280; font-size: 11px; margin-top: 4px; }

  /* Detail panel */
  #detail {
    position: absolute; bottom: 16px; left: 16px; right: 16px; padding: 16px 20px;
    background: #1e2030; border: 1px solid #2a2d3a; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: none; z-index: 5;
  }
  #detail .title { font-weight: 600; font-size: 16px; color: #fff; margin-bottom: 6px; }
  #detail .meta { color: #9ca3af; font-size: 13px; }
  #detail .tags { color: #6b7280; font-size: 12px; margin-top: 6px; }
  #detail .close { position: absolute; top: 12px; right: 16px; cursor: pointer; color: #555; font-size: 18px; }
  #detail .close:hover { color: #e0e0e0; }

  /* Scrollbar */
  #tags-list::-webkit-scrollbar { width: 4px; }
  #tags-list::-webkit-scrollbar-track { background: transparent; }
  #tags-list::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 2px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>Knowledge Library</h2>
    <input type="text" id="search" placeholder="Search by title...">
  </div>
  <div id="stats"></div>
  <div id="tags-header">
    <span>Tags</span>
    <span id="clear-tags">Clear all</span>
  </div>
  <div id="tags-list"></div>
</div>

<div id="main">
  <svg></svg>
  <div class="tooltip"></div>
  <div id="detail">
    <span class="close">&times;</span>
    <div class="title"></div>
    <div class="meta"></div>
    <div class="tags"></div>
  </div>
</div>

<script>
const data = [{"id": "4b0495e5-a9cc-49b6-9c8a-db3a12f4cf3c", "title": "Agent Composition", "item_type": "raw", "maturity": "stub", "tags": "agents, composition, skills, orchestration", "x": -18.1439208984375, "y": -21.878225326538086}, {"id": "5d890b18-69b7-4042-be59-3b0c54e2c417", "title": "Agent Flattening", "item_type": "raw", "maturity": "summary", "tags": "agents, flattening, teams, orchestration", "x": -9.6414213180542, "y": -30.37879753112793}, {"id": "e7ffcd64-fec7-4baf-b6f0-7bbe93b14cbb", "title": "Design Principles for LLM-Native Pipelines", "item_type": "raw", "maturity": "summary", "tags": "llm-native, agentic-design, pipelines, externalized-state, orchestration", "x": -24.95995330810547, "y": -10.399003982543945}, {"id": "a1c52f39-b946-4af2-91f0-7217920ea127", "title": "Responsibility Patterns", "item_type": "raw", "maturity": "summary", "tags": "agents, responsibility, patterns, coordination, multi-agent", "x": -6.817469120025635, "y": -15.399012565612793}, {"id": "f36943bd-bd3d-4a7d-a188-4b9e8421b33e", "title": "Useful Custom Agents for Claude Code", "item_type": "raw", "maturity": "summary", "tags": "agents, catalog, reference, automation, multi-agent", "x": 6.631068229675293, "y": -11.190086364746094}, {"id": "f2999364-f468-4685-99d9-85da22427434", "title": "Knowledge Representation — Theory and Practice", "item_type": "raw", "maturity": "detailed", "tags": "knowledge-representation, epistemology, vector-search, embeddings, retrieval, research", "x": -67.3925552368164, "y": -11.302421569824219}, {"id": "b1bfe40d-4a6b-4099-a71a-0495aafa0e76", "title": "Dynamic Workspace Orchestration", "item_type": "raw", "maturity": "summary", "tags": "orchestration, multi-agent, architecture, agents, coordination", "x": -29.070497512817383, "y": -33.3624153137207}, {"id": "448a4258-b9c7-4632-b50d-c8a848773b79", "title": "Planning Guide", "item_type": "raw", "maturity": "summary", "tags": "planning, project-management, framework, execution, mental-models", "x": -35.58723831176758, "y": 5.77406644821167}, {"id": "f45f5487-20bd-42d4-b18b-e7e3e0b6910a", "title": "Money, Productivity, and Human Evolution", "item_type": "raw", "maturity": "detailed", "tags": "economics, philosophy, motivation, productivity, monetary-policy", "x": -84.80508422851562, "y": 13.289234161376953}, {"id": "6ad23bbb-b440-4fc6-a60f-97e8be86fb86", "title": "The Nature of Being", "item_type": "raw", "maturity": "detailed", "tags": "epistemology, knowledge-representation, consciousness, philosophy, ego", "x": -65.34040069580078, "y": 1.8929026126861572}, {"id": "78041f15-18dd-4449-ab4f-8618e3e3c197", "title": "Thoughts on Reality and Intelligence", "item_type": "raw", "maturity": "detailed", "tags": "intelligence, alignment, epistemology, spirituality, philosophy", "x": -69.82307434082031, "y": 11.126181602478027}, {"id": "efbce109-8d3f-4d7e-9b51-6b65e10bc73a", "title": "Structure & Movement — A Working Framework", "item_type": "raw", "maturity": "summary", "tags": "framework, epistemology, composition, biosignals, research", "x": -53.121742248535156, "y": 12.910418510437012}];

// --- State ---
let activeTags = new Set();
let searchQuery = "";
let selectedItem = null;

// --- Colors ---
const colors = { raw: "#4A90D9", nugget: "#27AE60", unknown: "#888" };
const dimOpacity = 0.12;

// --- Extract tags ---
const tagCounts = {};
data.forEach(d => {
  const tags = d.tags ? d.tags.split(", ").filter(t => t) : [];
  d._tags = tags;
  tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
});
const allTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);

// --- Render tags ---
const tagsList = document.getElementById("tags-list");
allTags.forEach(([tag, count]) => {
  const chip = document.createElement("span");
  chip.className = "tag-chip";
  chip.innerHTML = `${tag}<span class="tag-count">${count}</span>`;
  chip.addEventListener("click", () => {
    if (activeTags.has(tag)) { activeTags.delete(tag); chip.classList.remove("active"); }
    else { activeTags.add(tag); chip.classList.add("active"); }
    updateViz();
  });
  tagsList.appendChild(chip);
});

document.getElementById("clear-tags").addEventListener("click", () => {
  activeTags.clear();
  document.querySelectorAll(".tag-chip.active").forEach(c => c.classList.remove("active"));
  updateViz();
});

// --- Search ---
document.getElementById("search").addEventListener("input", (e) => {
  searchQuery = e.target.value.toLowerCase();
  updateViz();
});

// --- SVG setup ---
const mainEl = document.getElementById("main");
const width = mainEl.clientWidth;
const height = mainEl.clientHeight;
const margin = 60;

const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);
const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.3, 10])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

// --- Scales ---
const xExtent = d3.extent(data, d => d.x);
const yExtent = d3.extent(data, d => d.y);
const xPad = (xExtent[1] - xExtent[0]) * 0.15 || 1;
const yPad = (yExtent[1] - yExtent[0]) * 0.15 || 1;

const x = d3.scaleLinear().domain([xExtent[0] - xPad, xExtent[1] + xPad]).range([margin, width - margin]);
const y = d3.scaleLinear().domain([yExtent[0] - yPad, yExtent[1] + yPad]).range([height - margin, margin]);

const sizeMap = { stub: 8, summary: 12, detailed: 16, complete: 20 };
const tooltip = d3.select(".tooltip");

// --- Draw ---
const circles = g.selectAll("circle")
  .data(data)
  .join("circle")
    .attr("cx", d => x(d.x))
    .attr("cy", d => y(d.y))
    .attr("r", d => sizeMap[d.maturity] || 10)
    .attr("fill", d => colors[d.item_type] || colors.unknown)
    .attr("stroke", "#0f1117")
    .attr("stroke-width", 1.5)
    .attr("opacity", 0.85)
    .style("cursor", "pointer")
    .on("mouseover", (event, d) => {
      tooltip.style("opacity", 1)
        .html(`<div class="title">${d.title}</div>
               <div class="meta">${d.item_type} · ${d.maturity}</div>
               <div class="tags">${d.tags}</div>`);
    })
    .on("mousemove", (event) => {
      tooltip.style("left", (event.pageX + 14) + "px").style("top", (event.pageY - 14) + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0))
    .on("click", (event, d) => {
      selectedItem = d;
      showDetail(d);
      updateViz();
    });

const labels = g.selectAll(".label")
  .data(data)
  .join("text")
    .attr("class", "label")
    .attr("x", d => x(d.x))
    .attr("y", d => y(d.y) - (sizeMap[d.maturity] || 10) - 4)
    .attr("text-anchor", "middle")
    .text(d => d.title.length > 28 ? d.title.slice(0, 26) + "…" : d.title);

// --- Detail panel ---
const detail = document.getElementById("detail");
detail.querySelector(".close").addEventListener("click", () => {
  detail.style.display = "none";
  selectedItem = null;
  updateViz();
});

function showDetail(d) {
  detail.style.display = "block";
  detail.querySelector(".title").textContent = d.title;
  detail.querySelector(".meta").textContent = `${d.item_type} · ${d.maturity} · ${d.id}`;
  detail.querySelector(".tags").textContent = d.tags;
}

// --- Filter logic ---
function isVisible(d) {
  const matchesTags = activeTags.size === 0 || d._tags.some(t => activeTags.has(t));
  const matchesSearch = !searchQuery || d.title.toLowerCase().includes(searchQuery);
  return matchesTags && matchesSearch;
}

function updateViz() {
  const visibleCount = data.filter(isVisible).length;
  const rawCount = data.filter(d => d.item_type === "raw" && isVisible(d)).length;
  const nuggetCount = data.filter(d => d.item_type === "nugget" && isVisible(d)).length;

  // Stats
  document.getElementById("stats").innerHTML = `
    <span class="stat">${visibleCount} / ${data.length} items</span>
    <span class="stat"><span class="stat-dot" style="background:${colors.raw}"></span>${rawCount} raw</span>
    <span class="stat"><span class="stat-dot" style="background:${colors.nugget}"></span>${nuggetCount} nuggets</span>
  `;

  // Points
  circles.transition().duration(200)
    .attr("opacity", d => {
      if (!isVisible(d)) return dimOpacity;
      if (selectedItem && d.id === selectedItem.id) return 1;
      return 0.85;
    })
    .attr("stroke", d => selectedItem && d.id === selectedItem.id ? "#fff" : "#0f1117")
    .attr("stroke-width", d => selectedItem && d.id === selectedItem.id ? 2.5 : 1.5);

  // Labels
  labels.transition().duration(200)
    .attr("opacity", d => isVisible(d) ? 1 : dimOpacity);
}

// Initial render
updateViz();
</script>
</body>
</html>
